# npm distribution patch layer: registers the Aqua client plugin into the
# profile's browser roster. Installing the package with
#   dsh plugin --profile web add @deepseek-ai/dsh-client-ui-aqua
# pulls this patch into the profile's layer stack, and the row below makes
# the web UI load the plugin's bundled client (the package's `dsh.client`
# declaration marks it as a browser-roster entry).
#
# The entry name must be the installed package name exactly as it appears in
# node_modules (the scoped 3.8-era name); the bare `dsh-client-ui-aqua`
# specifier is not resolvable and leaves the host entry unactivated.
- insert:
    - id: ui-aqua
      name: '@deepseek-ai/dsh-client-ui-aqua'
